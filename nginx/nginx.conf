events {}

http {
  upstream node_app {
    server node:3100;  # Connects to your Node.js container
  }

  # HTTP (port 80) - for Certbot challenge and redirect
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS (port 443) - main reverse proxy
  server {
    listen 443 ssl;
    server_name api.dinersxpress.com;

    ssl_certificate /etc/letsencrypt/live/api.dinersxpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dinersxpress.com/privkey.pem;

    location / {
      proxy_pass http://node_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
