events {}

http {
  # S.14: no nginx version in headers or error pages.
  server_tokens off;

  # Modern TLS only; the server picks from the default strong ciphers.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Slow or stuck clients don't hold connections open.
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  upstream node_app {
    server node:3100;  # Connects to your Node.js container
  }

  # HTTP (port 80) - for Certbot challenge and redirect
  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS for any other name (or a bare IP): refuse the handshake, show nothing.
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  # HTTPS (port 443) - main reverse proxy
  # Security headers (HSTS, nosniff, frame options...) come from the API itself (helmet in
  # app.ts), so they aren't added here twice.
  server {
    listen 443 ssl;
    server_name api.ceseelia.com;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/api.ceseelia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ceseelia.com/privkey.pem;

    location / {
      proxy_pass http://node_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}
