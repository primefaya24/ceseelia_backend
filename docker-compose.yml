services:
  node:
    container_name: node
    build:
      context: ./node
    env_file:
      - ./node/.env
    expose:
      - "3100"
    restart: always
    networks:
      - internal
    # 9.6: the API's JSON logs go to CloudWatch (log group made by ceseelia_cloudformation, 30 days;
    # errors there drive the api-errors alarm). Non-blocking: a slow CloudWatch never stalls a
    # request. `docker logs node` still works (Docker keeps a local copy). The server's role
    # (CeseeliaServerRole) may write to this group only.
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ceseelia/prod/api
        awslogs-stream: node
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 8m

  nginx:
    container_name: nginx
    # S.14: a pinned stable release (update on purpose, never by accident).
    image: nginx:1.30.6-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/webroot:/var/www/certbot
      - ./certbot/ssl:/etc/letsencrypt
    depends_on:
      node:
        condition: service_healthy
    restart: always
    networks:
      - internal
    # Docker's default json-file log has no size cap; a busy nginx log would fill the disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  certbot:
    image: certbot/certbot:v5.10.0
    container_name: certbot
    volumes:
      - ./certbot/webroot:/var/www/certbot
      - ./certbot/ssl:/etc/letsencrypt
    restart: "no"

networks:
  internal:
    driver: bridge
