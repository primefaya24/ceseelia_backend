services:
  node:
    container_name: node
    build:
      context: ./node
    env_file:
      - ./node/.env
    expose:
      - "3100"
    restart: always
    networks:
      - internal

  nginx:
    container_name: nginx
    # S.14: a pinned stable release (update on purpose, never by accident).
    image: nginx:1.30.6-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/webroot:/var/www/certbot
      - ./certbot/ssl:/etc/letsencrypt
    depends_on:
      node:
        condition: service_healthy
    restart: always
    networks:
      - internal

  certbot:
    image: certbot/certbot:v5.10.0
    container_name: certbot
    volumes:
      - ./certbot/webroot:/var/www/certbot
      - ./certbot/ssl:/etc/letsencrypt
    restart: "no"

networks:
  internal:
    driver: bridge
